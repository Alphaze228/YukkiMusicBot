name: Deploy to Fly.io

on:
  push:
    branches:
      - main  # Trigger saat ada push ke branch 'main'
  pull_request:
    branches:
      - main  # Trigger saat ada pull request ke 'main'
  workflow_dispatch:  # Memungkinkan menjalankan workflow secara manual

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Fly.io CLI
        run: |
          curl -L https://fly.io/install.sh | sh
          export PATH=$HOME/.fly/bin:$PATH
          flyctl version

      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}  # Pastikan sudah menambahkan secret di GitHub
        run: |
          flyctl auth login --access-token "$FLY_API_TOKEN"
          flyctl deploy
